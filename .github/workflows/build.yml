name: Build JayDymo.exe

# Every push builds the exe (downloadable from the run's Artifacts).
# Pushing a version tag (e.g. v1.8) additionally publishes a GitHub Release with the exe.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JayDymo
          path: dist/JayDymo.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" js/model.js)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $VERSION in js/model.js" >&2; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/JayDymo.exe --title "JayDymo $VERSION" --generate-notes
