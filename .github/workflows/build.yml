name: Build JayDymo.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: JayDymo
          path: dist/JayDymo.exe
